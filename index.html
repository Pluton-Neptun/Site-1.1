<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на турнир</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Тестовый сайт для игроков и больших команд</h1>

        <form>
            <div class="form-group">
                <label for="name">Имя или псевдоним</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона оставьте или сами позвоните</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="days">в Какие дни хотите</label>
                <input type="text" id="days" name="days">
            </div>

            <div class="form-group">
                <label for="price">цена которая вас устроит</label>
                <input type="number" id="price" name="price">
            </div>

            <div class="form-group">
                <label for="team-wait">если есть команда можете подождать другую команду</label>
                <input type="text" id="team-wait" name="team-wait">
            </div>

            <div class="form-group">
                <label for="tournament-type">будете делать турнир или хотите по одиночному</label>
                <input type="text" id="tournament-type" name="tournament-type">
            </div>

            <button type="submit">Отправить заявку</button>
            
            <a href="table.html" class="enter-btn">Вход к списку участников</a>
        </form>
    </div>

    <!-- Левая зона с гигантским велоцераптором и кнопкой барабана (снаружи формы) -->
    <div class="raptor-stage" id="raptorStage">
        <div class="raptor-actor" id="raptorActor" title="Нажми на велоцераптора!">
            <img src="images/raptor.png" alt="Велоцераптор" class="raptor-img" id="raptorImg">
            <div class="fx-fire" id="fxFire"></div>
            <div class="fx-laser" id="fxLaser"></div>
            <div class="fx-skis" id="fxSkis"></div>
        </div>

        <div class="raptor-status-card" id="raptorStatusCard">
            <div class="status-phrase" id="raptorPhrase">Р-Р-Р! Ставки вверх! 🦖</div>
            <div class="status-sub" id="raptorReactionNum">Реакция №4: Ярость</div>
        </div>

        <button type="button" id="rouletteBtn" class="big-roulette-btn">
            БАРАБАН<br>ИНВЕСТИЦИЙ
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
